# Lightweight infrastructure only — use with local Java services (see scripts/start-local.ps1)
networks:
  ehipap-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: ehipap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ehipap
      POSTGRES_PASSWORD: ehipap_secret_2024
      POSTGRES_DB: ehipap
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - ehipap-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehipap -d ehipap"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ehipap-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    networks:
      - ehipap-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
